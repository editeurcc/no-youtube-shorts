<!doctype html>
<html lang="fr">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>No Shorts GUI</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            width: 260px;
            margin: 10px;
        }

        h1 {
            font-size: 14px;
            margin: 0 0 8px 0
        }

        .row {
            display: flex;
            align-items: center;
            margin: 8px 0
        }

        label {
            flex: 1
        }

        button {
            margin-right: 8px
        }

        .footer {
            margin-top: 10px;
            font-size: 12px;
            color: #666
        }
    </style>
</head>

<body>
    <h1>Extension No Shorts – Version GUI</h1>
    <div class="row"><label><input id="hideShorts" type="checkbox"> Masquer les Shorts</label></div>
    <div class="row"><label><input id="hideStories" type="checkbox"> Masquer les Stories</label></div>
    <div class="row"><label><input id="hideReels" type="checkbox"> Masquer les Reels</label></div>
    <div style="margin-top:12px">
        <button id="apply">Appliquer</button>
        <button id="reset">Réinitialiser</button>
    </div>
    <div class="footer">Extension No Shorts – Version GUI</div>
    <script src="popup.js"></script>
</body>

</html>
